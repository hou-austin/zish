"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 750
scan_timeout = 30
palette = "blue_owl"
continuation_prompt = "[▶▶](fg:blue) "

format = """
$os\
${custom.blue_owl_path}\
$git_branch\
$git_status\
${custom.git_close}\
$cmd_duration\
$status\
$fill\
$username\
$hostname\
$time\
$line_break\
$character"""

[palettes.blue_owl]
blue = "#01579B"
git_green = "#00C853"
git_yellow = "#FFEB3B"
git_orange = "#FFCC80"
git_purple = "#B388FF"
duration = "#49404F"
danger = "#910000"
navy = "#29315A"
navy_time = "#20284F"
cyan = "#43CCEA"
clock_green = "#3EC669"
root_purple = "#A313A8"
white = "#FFFFFF"
black = "#000000"

[os]
disabled = false
format = "[$symbol  ]($style)"
style = "fg:white"

[os.symbols]
Alpaquita = ""
Alpine = ""
Amazon = ""
Android = ""
Arch = ""
Artix = ""
CentOS = ""
Debian = ""
DragonFly = ""
Emscripten = ""
EndeavourOS = ""
Fedora = ""
FreeBSD = ""
Garuda = "󰛓"
Gentoo = ""
HardenedBSD = "󰞌"
Illumos = "󰈸"
Linux = ""
Mabox = ""
Macos = ""
Manjaro = ""
Mariner = ""
MidnightBSD = ""
Mint = ""
NetBSD = ""
NixOS = ""
OpenBSD = "󰈺"
OpenCloudOS = ""
openEuler = "󰏒"
openSUSE = ""
OracleLinux = "󰌷"
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
Redox = "󰀘"
Solus = "󰠳"
SUSE = ""
Ubuntu = ""
Unknown = ""
Windows = ""

[directory]
disabled = true
format = "[](fg:blue)[ $read_only$path ]($style)[ ](fg:blue)"
repo_root_format = "[](fg:blue)[ $read_only$repo_root$path ]($style)[ ](fg:blue)"
style = "fg:white bg:blue"
home_symbol = ""
read_only = " "
truncation_length = 2
truncation_symbol = ".../"
truncate_to_repo = false
fish_style_pwd_dir_length = 1
repo_root_style = "fg:white bg:blue"

[custom.blue_owl_path]
when = true
command = '"$(dirname "$STARSHIP_CONFIG")/render-path.sh"'
format = "$output"
unsafe_no_escape = true
shell = ["sh"]

[git_branch]
format = "[](fg:git_yellow)[ $symbol$branch(:$remote_branch) ]($style)"
style = "fg:black bg:git_yellow"
symbol = ""
truncation_length = 32
truncation_symbol = "..."

[git_status]
format = "([$all_status$ahead_behind ]($style))"
style = "fg:black bg:git_yellow"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "~${count} "
stashed = " ${count} "
modified = " ${count} "
staged = " ${count} "
renamed = "»${count} "
deleted = "x${count} "

[custom.git_close]
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
command = "printf ''"
format = "[ ](fg:git_yellow)"
shell = ["sh"]

[cmd_duration]
min_time = 0
format = "[](fg:duration)[ ${duration} ]($style)[ ](fg:duration)"
style = "fg:white bg:duration"
show_milliseconds = false

[status]
disabled = false
format = "[](fg:danger)[ $symbol$status ]($style)[ ](fg:danger)"
style = "fg:white bg:danger"
symbol = "! "
not_executable_symbol = "no-exec "
not_found_symbol = "not-found "
sigint_symbol = "SIGINT "
signal_symbol = "signal "

[fill]
symbol = " "
style = "none"

[character]
format = "$symbol "
success_symbol = "[❯](fg:white)"
error_symbol = "[❯](fg:#FF0000)"
vimcmd_symbol = "[❮](fg:white)"
vimcmd_replace_one_symbol = "[❮](fg:git_yellow)"
vimcmd_replace_symbol = "[❮](fg:git_yellow)"
vimcmd_visual_symbol = "[❮](fg:cyan)"

[username]
show_always = true
format = "[](fg:navy)[  $user]($style)"
style_user = "fg:cyan bg:navy"
style_root = "fg:git_yellow bg:root_purple"

[hostname]
ssh_only = false
format = "[ / $hostname ]($style)"
style = "fg:cyan bg:navy"
trim_at = "."

[time]
disabled = false
format = "[ $time ]($style)[](fg:navy_time)"
time_format = "%H:%M:%S"
style = "fg:clock_green bg:navy_time"
